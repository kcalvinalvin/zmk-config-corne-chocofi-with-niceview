# Uncomment the following lines to enable the Corne RGB Underglow
# CONFIG_ZMK_RGB_UNDERGLOW=y
# CONFIG_WS2812_STRIP=y

# Uncomment the following line to enable the Corne OLED Display
CONFIG_ZMK_DISPLAY=y

# Enable experimental connectivity feature to maybe help with bluetooth connectivity.
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y

# Increase bluetooth power consumption to have a better connection.
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Enable deep sleep. Defaults to 15 minutes.
CONFIG_ZMK_SLEEP=y

# Work around upstream nice_view glyph corruption post-Zephyr 4.1 (zmk#3219).
# Shield default is 8192; WPM widget pushes past that.
CONFIG_LV_Z_MEM_POOL_SIZE=32768
